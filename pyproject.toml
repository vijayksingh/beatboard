[project]
name = "beatboard"
version = "0.1.0"
description = "Read a track into a beat grid, bars, drums, sections and named sounds; cut a bar-true edit; export cues a picture runs on; prove the edit and the sync."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "librosa==0.11.0",
  "soundfile>=0.12",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.scripts]
beatboard = "beatboard.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
